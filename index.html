<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>一碗螺｜訂貨計算器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        /* Hide arrows in input number */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-12 text-slate-800">

    <!-- Floating Navigation Menu -->
    <div id="nav-container" class="fixed top-4 right-4 sm:top-5 sm:right-6 z-40">
        <button onclick="toggleNavMenu()" class="flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold text-xs sm:text-sm py-2.5 px-4 rounded-full shadow-lg hover:shadow-xl transition-all border border-indigo-400/30">
            <i class="fa-solid fa-compass"></i>
            <span>點我快速前往</span>
            <i id="nav-arrow" class="fa-solid fa-chevron-down text-xs transition-transform duration-200"></i>
        </button>

        <div id="nav-menu" class="hidden absolute right-0 mt-2 w-52 bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden py-1.5 transition-all divide-y divide-slate-100">
            <div class="py-0.5">
                <a href="javascript:void(0)" onclick="scrollToCategory('luosifen')" class="flex items-center space-x-2.5 px-4 py-2.5 text-xs font-semibold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 transition-colors">
                    <i class="fa-solid fa-bowl-food text-amber-500 w-4 text-center"></i>
                    <span>螺獅粉醬料</span>
                </a>
                <a href="javascript:void(0)" onclick="scrollToCategory('jintang')" class="flex items-center space-x-2.5 px-4 py-2.5 text-xs font-semibold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 transition-colors">
                    <i class="fa-solid fa-pepper-hot text-orange-500 w-4 text-center"></i>
                    <span>金湯醬料</span>
                </a>
                <a href="javascript:void(0)" onclick="scrollToCategory('liangmian')" class="flex items-center space-x-2.5 px-4 py-2.5 text-xs font-semibold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 transition-colors">
                    <i class="fa-solid fa-utensils text-rose-500 w-4 text-center"></i>
                    <span>涼麵醬料</span>
                </a>
                <a href="javascript:void(0)" onclick="scrollToCategory('guozhi')" class="flex items-center space-x-2.5 px-4 py-2.5 text-xs font-semibold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 transition-colors">
                    <i class="fa-solid fa-glass-water-droplet text-emerald-500 w-4 text-center"></i>
                    <span>濃縮果汁</span>
                </a>
                <a href="javascript:void(0)" onclick="scrollToCategory('canju')" class="flex items-center space-x-2.5 px-4 py-2.5 text-xs font-semibold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 transition-colors">
                    <i class="fa-solid fa-box-open text-purple-500 w-4 text-center"></i>
                    <span>餐具+瓶子</span>
                </a>
                <a href="javascript:void(0)" onclick="scrollToCategory('liangmian_food')" class="flex items-center space-x-2.5 px-4 py-2.5 text-xs font-semibold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 transition-colors">
                    <i class="fa-solid fa-bowl-rice text-teal-500 w-4 text-center"></i>
                    <span>涼麵</span>
                </a>
                <a href="javascript:void(0)" onclick="scrollToCategory('lengdong')" class="flex items-center space-x-2.5 px-4 py-2.5 text-xs font-semibold text-slate-700 hover:bg-indigo-50 hover:text-indigo-600 transition-colors">
                    <i class="fa-solid fa-snowflake text-cyan-500 w-4 text-center"></i>
                    <span>冷凍</span>
                </a>
            </div>
            <div class="py-0.5 bg-slate-50/50">
                <a href="javascript:void(0)" onclick="scrollToCategory('summary-section')" class="flex items-center space-x-2.5 px-4 py-2.5 text-xs font-bold text-indigo-700 hover:bg-indigo-100/70 transition-colors">
                    <i class="fa-solid fa-clipboard-list text-indigo-600 w-4 text-center"></i>
                    <span>已點選訂購明細</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="max-w-4xl mx-auto px-3 sm:px-6 py-6 sm:py-8">
        <!-- Header -->
        <header class="text-center mb-6 sm:mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 rounded-2xl bg-indigo-600 text-white mb-3 shadow-lg shadow-indigo-200">
                <i class="fa-solid fa-calculator text-xl sm:text-2xl"></i>
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">一碗螺｜訂貨計算器</h1>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">即時試算品項金額與快速複製訂購明細</p>
        </header>

        <!-- Dynamic Category Tables Container -->
        <main id="tables-container" class="space-y-6">
            <!-- Dynamic tables will be rendered by JS -->
        </main>

        <!-- Grand Total Section -->
        <div class="mt-8 bg-gradient-to-r from-indigo-900 to-slate-900 text-white rounded-2xl p-5 sm:p-6 shadow-xl border border-indigo-800">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-indigo-500/20 flex items-center justify-center text-indigo-300">
                        <i class="fa-solid fa-coins text-lg"></i>
                    </div>
                    <div>
                        <span class="text-xs font-semibold text-indigo-300 uppercase tracking-wider block">總計金額</span>
                        <h3 class="text-base sm:text-lg font-bold text-white">全部加總總金額</h3>
                    </div>
                </div>
                <div class="text-right">
                    <span id="grand-total" class="text-2xl sm:text-4xl font-extrabold text-emerald-400 font-mono tracking-tight">NT$ 0</span>
                </div>
            </div>
        </div>

        <!-- Detail Summary Box Section -->
        <div id="summary-section" class="mt-6 bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 sm:p-6 scroll-mt-6">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold text-slate-800 flex items-center space-x-2 text-base">
                    <i class="fa-solid fa-clipboard-list text-indigo-600"></i>
                    <span>已點選訂購明細</span>
                </h3>
                <span id="item-count-badge" class="text-xs font-semibold bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full border border-indigo-100">
                    已選 0 項商品
                </span>
            </div>

            <!-- Output Display Box -->
            <div id="summary-box" class="bg-slate-50 rounded-xl p-4 border border-slate-200 text-xs sm:text-sm text-slate-700 font-mono whitespace-pre-wrap min-h-[120px] leading-relaxed select-all">
                <span class="text-slate-400 italic font-sans">尚未選擇任何商品項目...</span>
            </div>

            <!-- Copy and Reset Actions -->
            <div class="mt-4 flex flex-col sm:flex-row items-center gap-3">
                <button id="copy-btn" onclick="copySummary()" class="w-full sm:w-auto flex-1 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold py-3 px-6 rounded-xl shadow-md shadow-indigo-200 transition-all flex items-center justify-center space-x-2 group">
                    <i class="fa-regular fa-copy group-hover:scale-110 transition-transform"></i>
                    <span>複製訂購明細文字</span>
                </button>
                <button onclick="resetAll()" class="w-full sm:w-auto bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold py-3 px-5 rounded-xl transition-all flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-rotate-left text-xs"></i>
                    <span>清空重填</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none z-50">
        <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
        <span id="toast-msg" class="text-sm font-medium">已複製到剪貼簿</span>
    </div>

    <script>
        /* Data definition for all product categories */
        const initialCategories = [
            {
                id: "luosifen",
                name: "螺獅粉醬料",
                icon: "fa-bowl-food",
                badgeBg: "bg-amber-50 text-amber-800 border-amber-200",
                items: [
                    { id: "l1", name: "米粉20公斤", price: 2700, unit: "箱", quantity: 0 },
                    { id: "l2", name: "原汁濃縮5公斤", price: 1600, unit: "瓶", quantity: 0 },
                    { id: "l3", name: "酸筍2.5公斤", price: 900, unit: "包", quantity: 0 },
                    { id: "l4", name: "酸豆2.5公斤", price: 900, unit: "包", quantity: 0 },
                    { id: "l5", name: "腐竹5公斤", price: 2000, unit: "包", quantity: 0 },
                    { id: "l6", name: "一碗螺配方", price: 2800, unit: "組", quantity: 0 },
                    { id: "l7", name: "魔鬼辣油", price: 450, unit: "瓶", quantity: 0 },
                    { id: "l8", name: "必勝螺辣椒油4.75公斤", price: 1800, unit: "瓶", quantity: 0 }
                ]
            },
            {
                id: "jintang",
                name: "金湯醬料",
                icon: "fa-pepper-hot",
                badgeBg: "bg-orange-50 text-orange-800 border-orange-200",
                items: [
                    { id: "j1", name: "老母雞", price: 540, unit: "包", quantity: 0 },
                    { id: "j2", name: "花椒麻", price: 540, unit: "包", quantity: 0 },
                    { id: "j3", name: "濃酸菜", price: 540, unit: "包", quantity: 0 },
                    { id: "j4", name: "不辣老母雞", price: 540, unit: "包", quantity: 0 }
                ]
            },
            {
                id: "liangmian",
                name: "涼麵醬料",
                icon: "fa-utensils",
                badgeBg: "bg-rose-50 text-rose-800 border-rose-200",
                items: [
                    { id: "lm1", name: "香辣", price: 500, unit: "包", quantity: 0 },
                    { id: "lm2", name: "麻辣", price: 500, unit: "包", quantity: 0 },
                    { id: "lm3", name: "糖醋麻辣", price: 500, unit: "包", quantity: 0 }
                ]
            },
            {
                id: "guozhi",
                name: "濃縮果汁",
                icon: "fa-glass-water-droplet",
                badgeBg: "bg-emerald-50 text-emerald-800 border-emerald-200",
                items: [
                    { id: "gz1", name: "荔枝2.5公斤", price: 230, unit: "瓶", quantity: 0 },
                    { id: "gz2", name: "蘋果2.5公斤", price: 260, unit: "瓶", quantity: 0 },
                    { id: "gz3", name: "水蜜桃2.5公斤", price: 245, unit: "瓶", quantity: 0 }
                ]
            },
            {
                id: "canju",
                name: "餐具+瓶子",
                icon: "fa-box-open",
                badgeBg: "bg-purple-50 text-purple-800 border-purple-200",
                items: [
                    { id: "c1", name: "1300cc金箔紙碗", price: 270, unit: "條", quantity: 0 },
                    { id: "c2", name: "1300cc金箔蓋子", price: 50, unit: "條", quantity: 0 },
                    { id: "c3", name: "900cc紙碗", price: 160, unit: "條", quantity: 0 },
                    { id: "c4", name: "900cc蓋子", price: 69, unit: "條", quantity: 0 },
                    { id: "c5", name: "390cc紙碗", price: 75, unit: "條", quantity: 0 },
                    { id: "c6", name: "390cc蓋子", price: 25, unit: "條", quantity: 0 },
                    { id: "c7", name: "260cc紙碗", price: 50, unit: "條", quantity: 0 },
                    { id: "c8", name: "260cc蓋子", price: 20, unit: "條", quantity: 0 },
                    { id: "c9", name: "筷子", price: 24, unit: "包", quantity: 0 },
                    { id: "c10", name: "湯匙", price: 26, unit: "包", quantity: 0 },
                    { id: "c11", name: "半斤袋10包", price: 230, unit: "組", quantity: 0 },
                    { id: "c12", name: "兩斤袋10包", price: 230, unit: "組", quantity: 0 },
                    { id: "c13", name: "耐熱袋 7*10", price: 54, unit: "包", quantity: 0 },
                    { id: "c14", name: "綁提圈", price: 50, unit: "包", quantity: 0 },
                    { id: "c15", name: "湯包鋁袋(1000入)", price: 3000, unit: "箱", quantity: 0 },
                    { id: "c16", name: "玻璃鼎盅(3件套)", price: 35, unit: "組", quantity: 0 },
                    { id: "c17", name: "外袋提袋(一包50入)", price: 600, unit: "包", quantity: 0 },
                    { id: "c18", name: "700ml方形塑膠瓶+蓋子", price: 950, unit: "箱", quantity: 0 }
                ]
            },
            {
                id: "liangmian_food",
                name: "涼麵",
                icon: "fa-bowl-rice",
                badgeBg: "bg-teal-50 text-teal-800 border-teal-200",
                hasDivider: true,
                items: [
                    { id: "lmf1", name: "涼麵", price: 400, unit: "箱", quantity: 0 },
                    { id: "lmf2", name: "醬油包", price: 600, unit: "箱", quantity: 0 },
                    { id: "lmf3", name: "麻醬包", price: 700, unit: "箱", quantity: 0 }
                ]
            },
            {
                id: "lengdong",
                name: "冷凍",
                icon: "fa-snowflake",
                badgeBg: "bg-cyan-50 text-cyan-800 border-cyan-200",
                hasDivider: true,
                items: [
                    { id: "ld1", name: "8牛五花", price: 320, unit: "包", quantity: 0 },
                    { id: "ld2", name: "9豬五花", price: 270, unit: "包", quantity: 0 },
                    { id: "ld3", name: "14鹹豬肉", price: 950, unit: "箱", quantity: 0 },
                    { id: "ld4", name: "15帶皮豬五花", price: 0, unit: "箱", quantity: 0 },
                    { id: "ld5", name: "16雞絲", price: 3480, unit: "箱", quantity: 0 },
                    { id: "ld6", name: "18豬腳圈", price: 1500, unit: "箱", quantity: 0 }
                ]
            }
        ];

        // Clone state safely
        let categoriesData = JSON.parse(JSON.stringify(initialCategories));

        function render() {
            const container = document.getElementById('tables-container');
            let grandTotal = 0;
            let totalSelectedTypes = 0;
            let summaryBlocks = [];

            let htmlContent = '';

            categoriesData.forEach(cat => {
                let catRowsHtml = '';
                let catSelectedLines = [];

                cat.items.forEach(item => {
                    const subtotal = item.price * item.quantity;
                    grandTotal += subtotal;

                    if (item.quantity > 0) {
                        totalSelectedTypes++;
                        catSelectedLines.push(`• ${item.name} x ${item.quantity}${item.unit} (NT$ ${subtotal.toLocaleString()})`);
                    }

                    const subtotalFormatted = subtotal > 0 ? 'NT$ ' + subtotal.toLocaleString() : '$ 0';
                    const subtotalClass = subtotal > 0 ? 'text-indigo-600 font-bold' : 'text-slate-400';
                    const minusDisabled = item.quantity <= 0 ? 'disabled' : '';

                    catRowsHtml += `
                        <tr class="border-b border-slate-100 hover:bg-slate-50/80 transition-colors">
                            <td class="px-3 sm:px-4 py-3 text-xs sm:text-sm font-medium text-slate-800">${item.name}</td>
                            <td class="px-3 sm:px-4 py-3 text-xs sm:text-sm text-slate-500 font-mono">NT$ ${item.price.toLocaleString()}</td>
                            <td class="px-2 sm:px-4 py-3 text-center">
                                <div class="inline-flex items-center space-x-1 bg-slate-100 rounded-lg p-1 border border-slate-200">
                                    <button type="button" onclick="updateQuantity('${cat.id}', '${item.id}', -1)" ${minusDisabled} class="w-6 h-6 sm:w-7 sm:h-7 rounded-md bg-white text-slate-700 shadow-sm hover:bg-slate-200 active:scale-95 flex items-center justify-center text-xs font-bold transition-all disabled:opacity-30 disabled:hover:bg-white disabled:active:scale-100">
                                        <i class="fa-solid fa-minus"></i>
                                    </button>
                                    <input type="number" min="0" value="${item.quantity}" onchange="setQuantity('${cat.id}', '${item.id}', this.value)" class="w-10 sm:w-12 text-center bg-transparent text-xs sm:text-sm font-bold text-slate-800 focus:outline-none focus:ring-1 focus:ring-indigo-500 rounded font-mono">
                                    <button type="button" onclick="updateQuantity('${cat.id}', '${item.id}', 1)" class="w-6 h-6 sm:w-7 sm:h-7 rounded-md bg-indigo-600 text-white shadow-sm hover:bg-indigo-700 active:scale-95 flex items-center justify-center text-xs font-bold transition-all">
                                        <i class="fa-solid fa-plus"></i>
                                    </button>
                                </div>
                            </td>
                            <td class="px-2 sm:px-4 py-3 text-xs sm:text-sm text-slate-500 font-medium">${item.unit}</td>
                            <td class="px-3 sm:px-4 py-3 text-xs sm:text-sm text-right font-mono ${subtotalClass}">
                                ${subtotalFormatted}
                            </td>
                        </tr>
                    `;
                });

                if (catSelectedLines.length > 0) {
                    let blockText = `【${cat.name}】\n` + catSelectedLines.join('\n');
                    // 只有當上方已有其他已選類別（summaryBlocks.length > 0）時，才在涼麵與冷凍上方加入分隔線
                    if (cat.hasDivider && summaryBlocks.length > 0) {
                        blockText = `--------------------\n` + blockText;
                    }
                    summaryBlocks.push(blockText);
                }

                htmlContent += `
                    <div id="${cat.id}" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 overflow-hidden scroll-mt-6">
                        <div class="px-4 sm:px-6 py-4 bg-slate-50/70 border-b border-slate-100 flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <div class="w-8 h-8 rounded-lg ${cat.badgeBg} flex items-center justify-center text-xs shadow-xs border">
                                    <i class="fa-solid ${cat.icon}"></i>
                                </div>
                                <h2 class="font-bold text-slate-800 text-base sm:text-lg">${cat.name}</h2>
                            </div>
                            <span class="text-xs text-slate-400 font-medium">${cat.items.length} 項商品</span>
                        </div>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse min-w-[500px]">
                                <thead>
                                    <tr class="bg-slate-50/40 text-slate-400 text-[11px] sm:text-xs uppercase font-semibold border-b border-slate-100">
                                        <th class="px-3 sm:px-4 py-2.5">品項</th>
                                        <th class="px-3 sm:px-4 py-2.5">金額</th>
                                        <th class="px-2 sm:px-4 py-2.5 text-center">數量</th>
                                        <th class="px-2 sm:px-4 py-2.5">單位</th>
                                        <th class="px-3 sm:px-4 py-2.5 text-right">金額 x 數量</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${catRowsHtml}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = htmlContent;

            // Update Grand Total
            document.getElementById('grand-total').innerText = 'NT$ ' + grandTotal.toLocaleString();

            // Update Summary Textbox & Badge
            const summaryBox = document.getElementById('summary-box');
            const itemCountBadge = document.getElementById('item-count-badge');

            itemCountBadge.innerText = `已選 ${totalSelectedTypes} 項商品`;

            if (summaryBlocks.length > 0) {
                let finalText = summaryBlocks.join('\n\n');
                finalText += `\n\n====================\n【全部加總總金額】NT$ ${grandTotal.toLocaleString()}`;
                summaryBox.innerText = finalText;
            } else {
                summaryBox.innerHTML = '<span class="text-slate-400 italic font-sans">尚未選擇任何商品項目...</span>';
            }
        }

        function updateQuantity(catId, itemId, change) {
            const cat = categoriesData.find(c => c.id === catId);
            if (cat) {
                const item = cat.items.find(i => i.id === itemId);
                if (item) {
                    item.quantity = Math.max(0, item.quantity + change);
                    render();
                }
            }
        }

        function setQuantity(catId, itemId, value) {
            const val = parseInt(value, 10);
            const qty = isNaN(val) || val < 0 ? 0 : val;
            const cat = categoriesData.find(c => c.id === catId);
            if (cat) {
                const item = cat.items.find(i => i.id === itemId);
                if (item) {
                    item.quantity = qty;
                    render();
                }
            }
        }

        function resetAll() {
            categoriesData.forEach(cat => {
                cat.items.forEach(item => {
                    item.quantity = 0;
                });
            });
            render();
            showToast('已清空所有點選數量', 'fa-rotate-left');
        }

        function copySummary() {
            const summaryBox = document.getElementById('summary-box');
            const textToCopy = summaryBox.innerText;

            if (!textToCopy || textToCopy.includes('尚未選擇任何商品項目')) {
                showToast('尚未選擇任何商品項目！', 'fa-circle-exclamation');
                return;
            }

            // Fallback clipboard logic for strict iframe contexts
            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('已成功複製訂購明細！', 'fa-circle-check');
                } else {
                    showToast('複製失敗，請手動選取文字', 'fa-triangle-exclamation');
                }
            } catch (err) {
                showToast('複製失敗，請手動選取文字', 'fa-triangle-exclamation');
            } finally {
                document.body.removeChild(textarea);
            }
        }

        /* Nav Dropdown Controls */
        function toggleNavMenu() {
            const menu = document.getElementById('nav-menu');
            const arrow = document.getElementById('nav-arrow');
            menu.classList.toggle('hidden');
            arrow.classList.toggle('rotate-180');
        }

        function scrollToCategory(elementId) {
            const target = document.getElementById(elementId);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
            const menu = document.getElementById('nav-menu');
            const arrow = document.getElementById('nav-arrow');
            if (menu && !menu.classList.contains('hidden')) {
                menu.classList.add('hidden');
                arrow.classList.remove('rotate-180');
            }
        }

        function showToast(message, iconClass = 'fa-circle-check') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.innerText = message;
            toastIcon.className = `fa-solid ${iconClass} text-emerald-400 text-lg`;

            toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
            }, 2500);
        }

        // Close dropdown when clicking outside
        document.addEventListener('click', function(event) {
            const navContainer = document.getElementById('nav-container');
            const navMenu = document.getElementById('nav-menu');
            const navArrow = document.getElementById('nav-arrow');
            if (navContainer && !navContainer.contains(event.target)) {
                if (navMenu && !navMenu.classList.contains('hidden')) {
                    navMenu.classList.add('hidden');
                    navArrow.classList.remove('rotate-180');
                }
            }
        });

        // Initialize on page load
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
