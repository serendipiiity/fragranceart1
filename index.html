<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>一碗螺｜訂貨計算器</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Hide arrows in input number */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
            font-size: 16px !important; /* Prevents auto-zoom on iOS */
        }
        /* Touch optimization for buttons */
        .touch-btn {
            touch-action: manipulation;
        }
        /* Dynamic scroll margin top for sticky header offset */
        .scroll-target {
            scroll-margin-top: var(--header-height, 160px);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen pb-28 sm:pb-16 text-slate-800">

    <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200/80 shadow-xs">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-orange-600 text-white flex items-center justify-center shadow-md shadow-orange-200">
                    <i class="fa-solid fa-calculator text-base sm:text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-xl font-extrabold text-slate-900 tracking-tight leading-tight">一碗螺｜訂貨計算器</h1>
                    <p class="text-[10px] sm:text-xs text-slate-500 hidden sm:block">即時試算品項金額與快速複製訂購明細</p>
                </div>
            </div>

            <!-- Top Right Grand Total Display -->
            <div class="text-right bg-orange-50/80 px-3 py-1.5 rounded-xl border border-orange-100/80">
                <span class="text-[10px] sm:text-xs text-slate-500 font-bold block">總計金額</span>
                <span id="header-grand-total" class="text-sm sm:text-base font-extrabold text-orange-600 font-mono tracking-tight">NT$ 0</span>
            </div>
        </div>

        <!-- Responsive Flex-Wrap Category Quick Pills -->
        <div class="border-t border-slate-100 bg-slate-50/80 px-3 py-2.5">
            <div class="flex flex-wrap items-center gap-1.5 sm:gap-2 max-w-4xl mx-auto">
                <button onclick="scrollToCategory('luosifen')" class="touch-btn px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full text-xs font-bold bg-amber-100/80 text-amber-900 border border-amber-200/80 hover:bg-amber-200 active:scale-95 transition-all flex items-center space-x-1.5">
                    <i class="fa-solid fa-bowl-food text-amber-700 text-xs"></i>
                    <span>螺獅粉醬料</span>
                </button>
                <button onclick="scrollToCategory('jintang')" class="touch-btn px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full text-xs font-bold bg-orange-100/80 text-orange-900 border border-orange-200/80 hover:bg-orange-200 active:scale-95 transition-all flex items-center space-x-1.5">
                    <i class="fa-solid fa-pepper-hot text-orange-700 text-xs"></i>
                    <span>金湯醬料</span>
                </button>
                <button onclick="scrollToCategory('liangmian')" class="touch-btn px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full text-xs font-bold bg-rose-100/80 text-rose-900 border border-rose-200/80 hover:bg-rose-200 active:scale-95 transition-all flex items-center space-x-1.5">
                    <i class="fa-solid fa-utensils text-rose-700 text-xs"></i>
                    <span>涼麵醬料</span>
                </button>
                <button onclick="scrollToCategory('guozhi')" class="touch-btn px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full text-xs font-bold bg-emerald-100/80 text-emerald-900 border border-emerald-200/80 hover:bg-emerald-200 active:scale-95 transition-all flex items-center space-x-1.5">
                    <i class="fa-solid fa-wine-bottle text-emerald-700 text-xs"></i>
                    <span>濃縮果汁</span>
                </button>
                <button onclick="scrollToCategory('canju')" class="touch-btn px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full text-xs font-bold bg-purple-100/80 text-purple-900 border border-purple-200/80 hover:bg-purple-200 active:scale-95 transition-all flex items-center space-x-1.5">
                    <i class="fa-solid fa-box-open text-purple-700 text-xs"></i>
                    <span>餐具+瓶子</span>
                </button>
                <button onclick="scrollToCategory('liangmian_food')" class="touch-btn px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full text-xs font-bold bg-teal-100/80 text-teal-900 border border-teal-200/80 hover:bg-teal-200 active:scale-95 transition-all flex items-center space-x-1.5">
                    <i class="fa-solid fa-bowl-rice text-teal-700 text-xs"></i>
                    <span>涼麵</span>
                </button>
                <button onclick="scrollToCategory('lengdong')" class="touch-btn px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full text-xs font-bold bg-cyan-100/80 text-cyan-900 border border-cyan-200/80 hover:bg-cyan-200 active:scale-95 transition-all flex items-center space-x-1.5">
                    <i class="fa-solid fa-snowflake text-cyan-700 text-xs"></i>
                    <span>冷凍</span>
                </button>
                <button onclick="scrollToCategory('summary-section')" class="touch-btn px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-full text-xs font-bold bg-orange-600 text-white shadow-xs hover:bg-orange-700 active:scale-95 transition-all flex items-center space-x-1">
                    <i class="fa-solid fa-clipboard-list text-[10px]"></i>
                    <span>訂購明細</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-3 sm:px-6 pt-4 pb-6">

        <!-- Dynamic Category Containers -->
        <div id="tables-container" class="space-y-4 sm:space-y-6">
            <!-- Dynamic category cards generated via JS -->
        </div>

        <!-- Grand Total Card -->
        <div class="mt-6 sm:mt-8 bg-gradient-to-r from-orange-50 via-orange-100/70 to-amber-50 text-slate-800 rounded-2xl p-4 sm:p-5 shadow-xs border border-orange-200/80">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-3 text-center sm:text-left">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-orange-600 text-white flex items-center justify-center shadow-xs shrink-0">
                        <i class="fa-solid fa-coins text-base"></i>
                    </div>
                    <h3 class="text-base sm:text-lg font-extrabold text-slate-800 tracking-tight">總計金額</h3>
                </div>
                <div class="text-center sm:text-right">
                    <span id="grand-total" class="text-2xl sm:text-3xl font-black text-orange-600 font-mono tracking-tight">NT$ 0</span>
                </div>
            </div>
        </div>

        <!-- Detail Summary Box Section -->
        <div id="summary-section" class="mt-6 bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 sm:p-6 scroll-target">
            <div class="flex items-center justify-between mb-3">
                <h3 class="font-bold text-slate-800 flex items-center space-x-2 text-base">
                    <i class="fa-solid fa-clipboard-list text-orange-600"></i>
                    <span>訂購明細</span>
                </h3>
                <span id="item-count-badge" class="text-xs font-bold bg-orange-50 text-orange-700 px-3 py-1 rounded-full border border-orange-100">
                    已選 0 項商品
                </span>
            </div>

            <!-- Output Display Box -->
            <div id="summary-box" class="bg-slate-50 rounded-xl p-3.5 sm:p-4 border border-slate-200 text-xs sm:text-sm text-slate-800 font-mono whitespace-pre-wrap min-h-[120px] leading-relaxed select-all overflow-x-auto">
                <span class="text-slate-400 italic font-sans">尚未選擇任何商品項目...</span>
            </div>

            <!-- Copy and Reset Actions -->
            <div class="mt-4 flex flex-col sm:flex-row items-center gap-2.5">
                <button id="copy-btn" onclick="copySummary()" class="touch-btn w-full sm:w-auto flex-1 bg-orange-600 hover:bg-orange-700 active:bg-orange-800 text-white font-bold py-3.5 px-6 rounded-xl shadow-md shadow-orange-200 transition-all flex items-center justify-center space-x-2">
                    <i class="fa-regular fa-copy text-base"></i>
                    <span>複製訂購明細文字</span>
                </button>
                <button onclick="resetAll()" class="touch-btn w-full sm:w-auto bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-600 font-bold py-3.5 px-5 rounded-xl transition-all flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-rotate-left text-xs"></i>
                    <span>清空重填</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Mobile Fixed Bottom Action Bar -->
    <div class="sm:hidden fixed bottom-0 left-0 right-0 z-40 bg-orange-50/95 backdrop-blur-md text-slate-800 border-t border-orange-200/80 px-4 py-2.5 shadow-2xl flex items-center justify-between">
        <div>
            <span id="mobile-item-count" class="text-[10px] text-slate-500 block font-bold">已選擇 0 項品項</span>
            <span id="mobile-grand-total" class="text-xl font-black text-orange-600 font-mono tracking-tight">NT$ 0</span>
        </div>
        <button onclick="scrollToCategory('summary-section')" class="touch-btn bg-orange-600 active:bg-orange-700 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-md flex items-center space-x-1.5">
            <i class="fa-solid fa-clipboard-list text-xs"></i>
            <span>查看明細</span>
        </button>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-orange-100 border border-orange-300 px-6 py-4 rounded-2xl shadow-xl shadow-orange-950/10 flex items-center space-x-3.5 transition-all duration-300 transform scale-90 opacity-0 pointer-events-none z-50 min-w-[240px] max-w-[90vw] justify-center">
        <i id="toast-icon" class="fa-solid fa-circle-check text-orange-600 text-xl"></i>
        <span id="toast-msg" class="text-sm sm:text-base font-bold text-orange-600">已成功複製訂購明細！</span>
    </div>

    <script>
        /* Product Category Data Definition */
        const initialCategories = [
            {
                id: "luosifen",
                name: "螺獅粉醬料",
                icon: "fa-bowl-food",
                badgeBg: "bg-amber-100 text-amber-800 border-amber-200",
                items: [
                    { id: "l1", name: "米粉20公斤", price: 2700, unit: "箱", quantity: 0 },
                    { id: "l6", name: "一碗螺配方", price: 2800, unit: "組", quantity: 0 },
                    { id: "l3", name: "酸筍2.5公斤", price: 900, unit: "包", quantity: 0 },
                    { id: "l4", name: "酸豆2.5公斤", price: 900, unit: "包", quantity: 0 },
                    { id: "l5", name: "腐竹5公斤", price: 2000, unit: "包", quantity: 0 },
                    { id: "l7", name: "魔鬼辣油", price: 450, unit: "瓶", quantity: 0 },
                    { id: "l8", name: "必勝螺辣椒油4.75公斤", price: 1800, unit: "瓶", quantity: 0 }
                ]
            },
            {
                id: "jintang",
                name: "金湯醬料",
                icon: "fa-pepper-hot",
                badgeBg: "bg-orange-100 text-orange-800 border-orange-200",
                items: [
                    { id: "j1", name: "老母雞", price: 540, unit: "包", quantity: 0 },
                    { id: "j2", name: "花椒麻", price: 540, unit: "包", quantity: 0 },
                    { id: "j3", name: "濃酸菜", price: 540, unit: "包", quantity: 0 },
                    { id: "j4", name: "不辣老母雞", price: 540, unit: "包", quantity: 0 }
                ]
            },
            {
                id: "liangmian",
                name: "涼麵醬料",
                icon: "fa-utensils",
                badgeBg: "bg-rose-100 text-rose-800 border-rose-200",
                items: [
                    { id: "lm1", name: "香辣", price: 500, unit: "包", quantity: 0 },
                    { id: "lm2", name: "麻辣", price: 500, unit: "包", quantity: 0 },
                    { id: "lm3", name: "糖醋麻辣", price: 500, unit: "包", quantity: 0 }
                ]
            },
            {
                id: "guozhi",
                name: "濃縮果汁",
                icon: "fa-wine-bottle",
                badgeBg: "bg-emerald-100 text-emerald-800 border-emerald-200",
                items: [
                    { id: "gz1", name: "荔枝2.5公斤", price: 230, unit: "瓶", quantity: 0 },
                    { id: "gz2", name: "蘋果2.5公斤", price: 260, unit: "瓶", quantity: 0 },
                    { id: "gz3", name: "水蜜桃2.5公斤", price: 245, unit: "瓶", quantity: 0 }
                ]
            },
            {
                id: "canju",
                name: "餐具+瓶子",
                icon: "fa-box-open",
                badgeBg: "bg-purple-100 text-purple-800 border-purple-200",
                items: [
                    { id: "c1", name: "1300cc金箔紙碗", price: 270, unit: "條", quantity: 0 },
                    { id: "c2", name: "1300cc金箔蓋子", price: 50, unit: "條", quantity: 0 },
                    { id: "c3", name: "900cc紙碗", price: 160, unit: "條", quantity: 0 },
                    { id: "c4", name: "900cc蓋子", price: 69, unit: "條", quantity: 0 },
                    { id: "c5", name: "390cc紙碗", price: 75, unit: "條", quantity: 0 },
                    { id: "c6", name: "390cc蓋子", price: 25, unit: "條", quantity: 0 },
                    { id: "c7", name: "260cc紙碗", price: 50, unit: "條", quantity: 0 },
                    { id: "c8", name: "260cc蓋子", price: 20, unit: "條", quantity: 0 },
                    { id: "c9", name: "筷子", price: 24, unit: "包", quantity: 0 },
                    { id: "c10", name: "湯匙", price: 26, unit: "包", quantity: 0 },
                    { id: "c11", name: "半斤袋10包", price: 230, unit: "組", quantity: 0 },
                    { id: "c12", name: "兩斤袋10包", price: 230, unit: "組", quantity: 0 },
                    { id: "c13", name: "耐熱袋 7*10", price: 54, unit: "包", quantity: 0 },
                    { id: "c14", name: "綁提圈", price: 50, unit: "包", quantity: 0 },
                    { id: "c15", name: "湯包鋁袋(1000入)", price: 3000, unit: "箱", quantity: 0 },
                    { id: "c16", name: "玻璃鼎盅(3件套)", price: 35, unit: "組", quantity: 0 },
                    { id: "c17", name: "外袋提袋(一包50入)", price: 600, unit: "包", quantity: 0 },
                    { id: "c18", name: "700ml方瓶+蓋子100入", price: 950, unit: "箱", quantity: 0 }
                ]
            },
            {
                id: "liangmian_food",
                name: "涼麵",
                icon: "fa-bowl-rice",
                badgeBg: "bg-teal-100 text-teal-800 border-teal-200",
                hasDivider: true,
                items: [
                    { id: "lmf1", name: "涼麵", price: 400, unit: "箱", quantity: 0 },
                    { id: "lmf2", name: "醬油包", price: 600, unit: "箱", quantity: 0 },
                    { id: "lmf3", name: "麻醬包", price: 700, unit: "箱", quantity: 0 }
                ]
            },
            {
                id: "lengdong",
                name: "冷凍",
                icon: "fa-snowflake",
                badgeBg: "bg-cyan-100 text-cyan-800 border-cyan-200",
                hasDivider: true,
                items: [
                    { id: "ld1", name: "8牛五花", price: 320, unit: "包", quantity: 0 },
                    { id: "ld2", name: "9豬五花", price: 270, unit: "包", quantity: 0 },
                    { id: "ld3", name: "14鹹豬肉", price: 950, unit: "箱", quantity: 0 },
                    { id: "ld4", name: "15帶皮豬五花", price: 0, unit: "箱", quantity: 0 },
                    { id: "ld5", name: "16雞絲", price: 3480, unit: "箱", quantity: 0 },
                    { id: "ld6", name: "18豬腳圈", price: 1500, unit: "箱", quantity: 0 }
                ]
            }
        ];

        // Deep clone state & sticker state
        let categoriesData = JSON.parse(JSON.stringify(initialCategories));
        let stickerData = {
            lychee: 0,
            apple: 0,
            lycheeApple: 0,
            peach: 0
        };

        function getMaxStickers() {
            const canjuCat = categoriesData.find(c => c.id === 'canju');
            if (!canjuCat) return 0;
            const bottleItem = canjuCat.items.find(i => i.id === 'c18');
            return bottleItem ? bottleItem.quantity * 5 : 0;
        }

        function updateSticker(type, change) {
            const maxStickers = getMaxStickers();
            const currentTotal = stickerData.lychee + stickerData.apple + stickerData.lycheeApple + stickerData.peach;
            
            if (change > 0 && currentTotal >= maxStickers) {
                showToast(`貼紙總數已達上限 (${maxStickers}張)`, 'fa-circle-exclamation', 'text-amber-600');
                return;
            }

            const newVal = stickerData[type] + change;
            if (newVal >= 0) {
                stickerData[type] = newVal;
                render();
            }
        }

        function setSticker(type, value) {
            const val = parseInt(value, 10);
            const qty = isNaN(val) || val < 0 ? 0 : val;
            
            const maxStickers = getMaxStickers();
            const otherTotal = Object.keys(stickerData).reduce((sum, key) => key === type ? sum : sum + stickerData[key], 0);
            
            if (otherTotal + qty > maxStickers) {
                stickerData[type] = Math.max(0, maxStickers - otherTotal);
                showToast(`貼紙總數已自動調整至上限 (${maxStickers}張)`, 'fa-circle-exclamation', 'text-amber-600');
            } else {
                stickerData[type] = qty;
            }
            render();
        }

        function render() {
            const container = document.getElementById('tables-container');
            let grandTotal = 0;
            let totalSelectedTypes = 0;
            let summaryBlocks = [];

            let htmlContent = '';

            categoriesData.forEach(cat => {
                let catMobileCardsHtml = '';
                let catDesktopTableRowsHtml = '';
                let catSelectedLines = [];

                cat.items.forEach(item => {
                    const subtotal = item.price * item.quantity;
                    grandTotal += subtotal;

                    if (item.quantity > 0) {
                        totalSelectedTypes++;
                        catSelectedLines.push(`• ${item.name} x ${item.quantity}${item.unit} (NT$ ${subtotal.toLocaleString()})`);
                    }

                    const isSelected = item.quantity > 0;
                    const subtotalFormatted = isSelected ? 'NT$ ' + subtotal.toLocaleString() : '$ 0';
                    const subtotalClass = isSelected ? 'text-orange-600 font-bold' : 'text-slate-400';
                    const minusDisabled = item.quantity <= 0 ? 'disabled' : '';

                    /* --- 1. Mobile Card Item Layout (< sm) --- */
                    catMobileCardsHtml += `
                        <div class="p-3.5 border-b border-slate-100 last:border-b-0 hover:bg-slate-50/50 transition-colors">
                            <div class="flex items-start justify-between gap-2 mb-2">
                                <div>
                                    <h4 class="text-sm font-bold text-slate-800 leading-snug">${item.name}</h4>
                                    <span class="text-xs text-slate-500 font-medium">NT$ ${item.price.toLocaleString()} / ${item.unit}</span>
                                </div>
                                <div class="text-right">
                                    <span class="text-xs ${subtotalClass} font-mono block">${subtotalFormatted}</span>
                                </div>
                            </div>
                            <div class="flex items-center justify-end mt-1">
                                <div class="inline-flex items-center space-x-1.5 bg-slate-100 rounded-xl p-1 border border-slate-200">
                                    <button type="button" onclick="updateQuantity('${cat.id}', '${item.id}', -1)" ${minusDisabled} class="touch-btn w-8 h-8 rounded-lg bg-white text-slate-800 shadow-xs active:bg-slate-200 flex items-center justify-center text-xs font-bold transition-all disabled:opacity-25 disabled:active:bg-white">
                                        <i class="fa-solid fa-minus"></i>
                                    </button>
                                    <input type="number" min="0" value="${item.quantity}" onchange="setQuantity('${cat.id}', '${item.id}', this.value)" class="w-12 text-center bg-transparent text-sm font-extrabold text-slate-800 focus:outline-none font-mono">
                                    <button type="button" onclick="updateQuantity('${cat.id}', '${item.id}', 1)" class="touch-btn w-8 h-8 rounded-lg bg-orange-600 text-white shadow-xs active:bg-orange-700 flex items-center justify-center text-xs font-bold transition-all">
                                        <i class="fa-solid fa-plus"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;

                    /* --- 2. Desktop Table Row Layout (>= sm) --- */
                    catDesktopTableRowsHtml += `
                        <tr class="border-b border-slate-100 hover:bg-slate-50/80 transition-colors">
                            <td class="px-4 py-3 text-sm font-medium text-slate-800">${item.name}</td>
                            <td class="px-4 py-3 text-sm text-slate-600 font-mono">NT$ ${item.price.toLocaleString()}</td>
                            <td class="px-3 py-3 text-center">
                                <div class="inline-flex items-center space-x-1 bg-slate-100 rounded-lg p-1 border border-slate-200">
                                    <button type="button" onclick="updateQuantity('${cat.id}', '${item.id}', -1)" ${minusDisabled} class="touch-btn w-7 h-7 rounded-md bg-white text-slate-700 shadow-xs hover:bg-slate-200 active:scale-95 flex items-center justify-center text-xs font-bold transition-all disabled:opacity-30 disabled:hover:bg-white">
                                        <i class="fa-solid fa-minus"></i>
                                    </button>
                                    <input type="number" min="0" value="${item.quantity}" onchange="setQuantity('${cat.id}', '${item.id}', this.value)" class="w-12 text-center bg-transparent text-sm font-bold text-slate-800 focus:outline-none font-mono">
                                    <button type="button" onclick="updateQuantity('${cat.id}', '${item.id}', 1)" class="touch-btn w-7 h-7 rounded-md bg-orange-600 text-white shadow-xs hover:bg-orange-700 active:scale-95 flex items-center justify-center text-xs font-bold transition-all">
                                        <i class="fa-solid fa-plus"></i>
                                    </button>
                                </div>
                            </td>
                            <td class="px-3 py-3 text-sm text-slate-600 font-medium">${item.unit}</td>
                            <td class="px-4 py-3 text-sm text-right font-mono ${subtotalClass}">
                                ${subtotalFormatted}
                            </td>
                        </tr>
                    `;
                });

                // Check for bottles category free sticker selections
                if (cat.id === 'canju') {
                    const selectedStickers = [];
                    if (stickerData.lychee > 0) selectedStickers.push(`荔枝 x ${stickerData.lychee}張`);
                    if (stickerData.apple > 0) selectedStickers.push(`蘋果 x ${stickerData.apple}張`);
                    if (stickerData.lycheeApple > 0) selectedStickers.push(`荔枝蘋果 x ${stickerData.lycheeApple}張`);
                    if (stickerData.peach > 0) selectedStickers.push(`水蜜桃 x ${stickerData.peach}張`);
                    if (selectedStickers.length > 0) {
                        catSelectedLines.push(`• 贈送貼紙(一張21次)：${selectedStickers.join('、')}`);
                    }
                }

                if (catSelectedLines.length > 0) {
                    let blockText = `【${cat.name}】\n` + catSelectedLines.join('\n');
                    if (cat.hasDivider && summaryBlocks.length > 0) {
                        blockText = `--------------------\n` + blockText;
                    }
                    summaryBlocks.push(blockText);
                }

                let stickerBlockHtml = '';
                if (cat.id === 'canju') {
                    const maxStickers = getMaxStickers();
                    const totalStickers = stickerData.lychee + stickerData.apple + stickerData.lycheeApple + stickerData.peach;
                    stickerBlockHtml = `
                        <div class="p-3 sm:p-4 bg-orange-50/70 border-t border-orange-100 rounded-b-2xl">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1.5 mb-2.5">
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs sm:text-sm font-extrabold text-orange-900 flex items-center gap-1.5">
                                        <i class="fa-solid fa-note-sticky text-orange-600"></i>
                                        贈送貼紙(一張21次)
                                    </span>
                                    <span class="text-[11px] font-bold text-orange-700 bg-orange-100/90 border border-orange-200 px-2 py-0.5 rounded-full">
                                        已選 ${totalStickers} / ${maxStickers} 張
                                    </span>
                                </div>
                                <p class="text-[11px] text-slate-500 font-medium">（未選擇貼紙則隨機出貨）</p>
                            </div>
                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                                <!-- Sticker 1 -->
                                <div class="flex items-center justify-between bg-white p-2.5 rounded-xl border border-orange-200/80 shadow-2xs">
                                    <span class="text-xs font-bold text-slate-700">荔枝</span>
                                    <div class="inline-flex items-center space-x-1 bg-slate-100 rounded-lg p-0.5 border border-slate-200">
                                        <button type="button" onclick="updateSticker('lychee', -1)" ${stickerData.lychee <= 0 ? 'disabled' : ''} class="touch-btn w-7 h-7 rounded-md bg-white text-slate-800 shadow-xs active:bg-slate-200 flex items-center justify-center text-xs font-bold transition-all disabled:opacity-25">
                                            <i class="fa-solid fa-minus"></i>
                                        </button>
                                        <input type="number" min="0" value="${stickerData.lychee}" onchange="setSticker('lychee', this.value)" class="w-10 text-center bg-transparent text-xs font-extrabold text-slate-800 focus:outline-none font-mono">
                                        <button type="button" onclick="updateSticker('lychee', 1)" class="touch-btn w-7 h-7 rounded-md bg-orange-600 text-white shadow-xs active:bg-orange-700 flex items-center justify-center text-xs font-bold transition-all">
                                            <i class="fa-solid fa-plus"></i>
                                        </button>
                                    </div>
                                </div>
                                <!-- Sticker 2 -->
                                <div class="flex items-center justify-between bg-white p-2.5 rounded-xl border border-orange-200/80 shadow-2xs">
                                    <span class="text-xs font-bold text-slate-700">蘋果</span>
                                    <div class="inline-flex items-center space-x-1 bg-slate-100 rounded-lg p-0.5 border border-slate-200">
                                        <button type="button" onclick="updateSticker('apple', -1)" ${stickerData.apple <= 0 ? 'disabled' : ''} class="touch-btn w-7 h-7 rounded-md bg-white text-slate-800 shadow-xs active:bg-slate-200 flex items-center justify-center text-xs font-bold transition-all disabled:opacity-25">
                                            <i class="fa-solid fa-minus"></i>
                                        </button>
                                        <input type="number" min="0" value="${stickerData.apple}" onchange="setSticker('apple', this.value)" class="w-10 text-center bg-transparent text-xs font-extrabold text-slate-800 focus:outline-none font-mono">
                                        <button type="button" onclick="updateSticker('apple', 1)" class="touch-btn w-7 h-7 rounded-md bg-orange-600 text-white shadow-xs active:bg-orange-700 flex items-center justify-center text-xs font-bold transition-all">
                                            <i class="fa-solid fa-plus"></i>
                                        </button>
                                    </div>
                                </div>
                                <!-- Sticker 3 -->
                                <div class="flex items-center justify-between bg-white p-2.5 rounded-xl border border-orange-200/80 shadow-2xs">
                                    <span class="text-xs font-bold text-slate-700">荔枝蘋果</span>
                                    <div class="inline-flex items-center space-x-1 bg-slate-100 rounded-lg p-0.5 border border-slate-200">
                                        <button type="button" onclick="updateSticker('lycheeApple', -1)" ${stickerData.lycheeApple <= 0 ? 'disabled' : ''} class="touch-btn w-7 h-7 rounded-md bg-white text-slate-800 shadow-xs active:bg-slate-200 flex items-center justify-center text-xs font-bold transition-all disabled:opacity-25">
                                            <i class="fa-solid fa-minus"></i>
                                        </button>
                                        <input type="number" min="0" value="${stickerData.lycheeApple}" onchange="setSticker('lycheeApple', this.value)" class="w-10 text-center bg-transparent text-xs font-extrabold text-slate-800 focus:outline-none font-mono">
                                        <button type="button" onclick="updateSticker('lycheeApple', 1)" class="touch-btn w-7 h-7 rounded-md bg-orange-600 text-white shadow-xs active:bg-orange-700 flex items-center justify-center text-xs font-bold transition-all">
                                            <i class="fa-solid fa-plus"></i>
                                        </button>
                                    </div>
                                </div>
                                <!-- Sticker 4 -->
                                <div class="flex items-center justify-between bg-white p-2.5 rounded-xl border border-orange-200/80 shadow-2xs">
                                    <span class="text-xs font-bold text-slate-700">水蜜桃</span>
                                    <div class="inline-flex items-center space-x-1 bg-slate-100 rounded-lg p-0.5 border border-slate-200">
                                        <button type="button" onclick="updateSticker('peach', -1)" ${stickerData.peach <= 0 ? 'disabled' : ''} class="touch-btn w-7 h-7 rounded-md bg-white text-slate-800 shadow-xs active:bg-slate-200 flex items-center justify-center text-xs font-bold transition-all disabled:opacity-25">
                                            <i class="fa-solid fa-minus"></i>
                                        </button>
                                        <input type="number" min="0" value="${stickerData.peach}" onchange="setSticker('peach', this.value)" class="w-10 text-center bg-transparent text-xs font-extrabold text-slate-800 focus:outline-none font-mono">
                                        <button type="button" onclick="updateSticker('peach', 1)" class="touch-btn w-7 h-7 rounded-md bg-orange-600 text-white shadow-xs active:bg-orange-700 flex items-center justify-center text-xs font-bold transition-all">
                                            <i class="fa-solid fa-plus"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                htmlContent += `
                    <div id="${cat.id}" class="bg-white rounded-2xl shadow-xs border border-slate-200/80 overflow-hidden scroll-target">
                        <!-- Category Header -->
                        <div class="px-4 py-3.5 bg-slate-50 border-b border-slate-100 flex items-center justify-between">
                            <div class="flex items-center space-x-2.5">
                                <div class="w-8 h-8 rounded-xl ${cat.badgeBg} flex items-center justify-center text-xs border shadow-2xs">
                                    <i class="fa-solid ${cat.icon}"></i>
                                </div>
                                <h2 class="font-bold text-slate-800 text-base sm:text-lg">${cat.name}</h2>
                            </div>
                            <span class="text-xs text-slate-400 font-medium bg-white px-2.5 py-1 rounded-full border border-slate-200/60">${cat.items.length} 項</span>
                        </div>

                        <!-- Mobile View (Card List) -->
                        <div class="block sm:hidden divide-y divide-slate-100">
                            ${catMobileCardsHtml}
                        </div>

                        <!-- Desktop View (Table) -->
                        <div class="hidden sm:block overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-50/60 text-slate-400 text-xs uppercase font-bold border-b border-slate-100">
                                        <th class="px-4 py-2.5">品項</th>
                                        <th class="px-4 py-2.5">單價</th>
                                        <th class="px-3 py-2.5 text-center">數量</th>
                                        <th class="px-3 py-2.5">單位</th>
                                        <th class="px-4 py-2.5 text-right">小計</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${catDesktopTableRowsHtml}
                                </tbody>
                            </table>
                        </div>
                        ${stickerBlockHtml}
                    </div>
                `;
            });

            container.innerHTML = htmlContent;

            // Update Grand Totals
            const grandTotalStr = 'NT$ ' + grandTotal.toLocaleString();
            document.getElementById('grand-total').innerText = grandTotalStr;
            document.getElementById('mobile-grand-total').innerText = grandTotalStr;
            const headerTotal = document.getElementById('header-grand-total');
            if (headerTotal) {
                headerTotal.innerText = grandTotalStr;
            }

            // Update Badges
            const itemCountBadge = document.getElementById('item-count-badge');
            const mobileItemCount = document.getElementById('mobile-item-count');

            itemCountBadge.innerText = `已選 ${totalSelectedTypes} 項商品`;
            mobileItemCount.innerText = `已選擇 ${totalSelectedTypes} 項品項`;

            // Update Summary Box
            const summaryBox = document.getElementById('summary-box');
            if (summaryBlocks.length > 0) {
                let finalText = summaryBlocks.join('\n\n');
                finalText += `\n\n====================\n【全部加總總金額】NT$ ${grandTotal.toLocaleString()}`;
                summaryBox.innerText = finalText;
            } else {
                summaryBox.innerHTML = '<span class="text-slate-400 italic font-sans">尚未選擇任何商品項目...</span>';
            }
        }

        function updateQuantity(catId, itemId, change) {
            const cat = categoriesData.find(c => c.id === catId);
            if (cat) {
                const item = cat.items.find(i => i.id === itemId);
                if (item) {
                    item.quantity = Math.max(0, item.quantity + change);
                    render();
                }
            }
        }

        function setQuantity(catId, itemId, value) {
            const val = parseInt(value, 10);
            const qty = isNaN(val) || val < 0 ? 0 : val;
            const cat = categoriesData.find(c => c.id === catId);
            if (cat) {
                const item = cat.items.find(i => i.id === itemId);
                if (item) {
                    item.quantity = qty;
                    render();
                }
            }
        }

        function resetAll() {
            categoriesData.forEach(cat => {
                cat.items.forEach(item => {
                    item.quantity = 0;
                });
            });
            stickerData = { lychee: 0, apple: 0, lycheeApple: 0, peach: 0 };
            render();
            showToast('已清空所有點選數量', 'fa-rotate-left', 'text-orange-600');
        }

        function copySummary() {
            const summaryBox = document.getElementById('summary-box');
            const textToCopy = summaryBox.innerText;

            if (!textToCopy || textToCopy.includes('尚未選擇任何商品項目')) {
                showToast('尚未選擇任何商品項目！', 'fa-circle-exclamation', 'text-amber-600');
                return;
            }

            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    showToast('已成功複製訂購明細！', 'fa-circle-check', 'text-orange-600');
                } else {
                    showToast('複製失敗，請手動選取文字', 'fa-triangle-exclamation', 'text-amber-600');
                }
            } catch (err) {
                showToast('複製失敗，請手動選取文字', 'fa-triangle-exclamation', 'text-amber-600');
            } finally {
                document.body.removeChild(textarea);
            }
        }

        function updateHeaderHeight() {
            const header = document.querySelector('header');
            if (header) {
                const height = header.offsetHeight + 16;
                document.documentElement.style.setProperty('--header-height', `${height}px`);
            }
        }

        function scrollToCategory(elementId) {
            updateHeaderHeight();
            const target = document.getElementById(elementId);
            const header = document.querySelector('header');
            if (target) {
                const headerHeight = header ? header.offsetHeight : 140;
                const extraPadding = 16;
                const elementTop = target.getBoundingClientRect().top + window.pageYOffset;
                const offsetPosition = elementTop - (headerHeight + extraPadding);

                window.scrollTo({
                    top: Math.max(0, offsetPosition),
                    behavior: 'smooth'
                });
            }
        }

        function showToast(message, iconClass = 'fa-circle-check', iconColorClass = 'text-orange-600') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.innerText = message;
            toastIcon.className = `fa-solid ${iconClass} ${iconColorClass} text-xl`;

            toast.classList.remove('scale-90', 'opacity-0', 'pointer-events-none');
            toast.classList.add('scale-100', 'opacity-100', 'pointer-events-auto');

            setTimeout(() => {
                toast.classList.remove('scale-100', 'opacity-100', 'pointer-events-auto');
                toast.classList.add('scale-90', 'opacity-0', 'pointer-events-none');
            }, 2200);
        }

        window.onload = function() {
            render();
            updateHeaderHeight();
            window.addEventListener('resize', updateHeaderHeight);
        };
    </script>
</body>
</html>
